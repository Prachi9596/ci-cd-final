apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3.20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: run-unit-tests
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --no-cache-dir nose
        if [ -f requirements.txt ]; then
          python -m pip install --no-cache-dir -r requirements.txt
        fi
        nosetests -v
